name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git identity
        run: |
          git config --global user.name "CI Test User"
          git config --global user.email "ci@example.com"

      - name: Run tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'

      - name: Privacy check
        run: python3 scripts/privacy-check.py --generic

  notify:
    needs: [tests]
    if: github.event_name == 'pull_request' && needs.tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Commenter la PR (tests verts)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$(mktemp)"
          {
            echo '<!-- cockpit-ci-tests-passed -->'
            echo '## Tests verts'
            echo ''
            echo "La CI est passée : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$body"
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file "$body"
