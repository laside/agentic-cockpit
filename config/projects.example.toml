# Agentic Cockpit V2 — Exemple de registre central multi-projets
# Copiez ce fichier vers ~/.config/agentic-cockpit/projects.toml (ou $COCKPIT_CONFIG_DIR/projects.toml)
# pour déclarer vos projets réels hors dépôt.
default_project = "cockpit"
cockpit_home = "~/agentic-cockpit"
cockpit_session_prefix = "cockpit"

[hardware.local]
host = "127.0.0.1"
port = 11434
gpu = "GPU local"
audit_model = "Gemma4-ctx:32k"
coder_model = "qwen2.5-coder:14b"
fixer_model = "qwen2.5-coder:7b"
fast_model = "qwen3:8b"
max_ctx_tokens = 16384
kv_cache_type = "q8_0"

# Le cockpit lui-même : ses évolutions passent par son propre pipeline (auto-amélioration).
[projects.cockpit]
name = "Agentic Cockpit"
root = "~/agentic-cockpit"
worktrees_sessions_dir = "~/agentic-cockpit-worktrees"
worktrees_tickets_dir = "~/agentic-cockpit-worktrees"
default_branch = "main"
milestones = ["C1", "C2", "C3"]
lint_cmd = "make lint"
test_unit_cmd = "make test"

[projects.cockpit.ports]
sidecar = 8795

# Projet de démonstration générique.
[projects.demo]
name = "Demo"
root = "~/projets/demo"
worktrees_sessions_dir = "~/projets/demo-worktrees"
worktrees_tickets_dir = "~/projets/demo-worktrees"
default_branch = "main"
milestones = ["M1", "M2", "M3"]
lint_cmd = "make lint"
test_unit_cmd = "make test"

[projects.demo.ports]
sidecar = 8790
