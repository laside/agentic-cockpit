# Agentic Cockpit V2 — Runners headless : une entrée par voie du Gouverneur de Quotas.
# Copiez ce fichier vers ~/.config/agentic-cockpit/runners.toml (ou $COCKPIT_CONFIG_DIR/runners.toml)
# pour personnaliser vos runners hors dépôt.
# Pour ajouter un LLM ou un CLI : copier un bloc, changer `argv`, et faire pointer une voie dessus.
# `{prompt}` est remplacé par la consigne du pipeline. La commande s'exécute dans le worktree du ticket.
# `agent` = panneau/identité affichée (deepseek, agy, mistral, local) ; `provider` = ligne de quota_state.

[defaults]
timeout_s = 900          # durée maximale d'un worker
max_attempts = 3         # tentatives avant escalade vers l'humain
gate_timeout_s = 600     # durée maximale de lint + tests (Porte 0)
gate1_timeout_s = 300    # durée maximale de l'audit local (Porte 1)
usd_to_eur = 0.92        # taux de conversion USD -> EUR pour le suivi des coûts
# Porte 1 statique, 0 token : un ticket qui touche du code source doit aussi toucher un test.
require_tests = true

[runners.deepseek_coder]
agent = "deepseek"
provider = "deepseek"
# Mesure réelle des tokens et du coût facturé à partir des évènements JSON d'opencode.
usage_format = "opencode_json"
# Modèle épinglé : sans --model, opencode peut retomber sur un modèle gratuit par défaut.
argv = ["opencode", "run", "--format", "json", "--model", "deepseek/deepseek-flash", "{prompt}"]

[runners.agy_standard]
agent = "agy"
provider = "agy"
# une seule session agy headless à la fois tant que la cohabitation n'est pas mesurée
max_parallel = 1
cost_source = "estimate"
# Mesure réelle des tokens depuis la sortie JSON d'agy (aucun coût fourni par le CLI).
usage_format = "agy_json"
# valeurs à calibrer : estimation forfaitaire par run, pas une mesure
window_pct_per_run = 4.0
window_hours = 5.0
estimated_cost_eur = 0.0
estimated_tokens_in = 0
estimated_tokens_out = 0
argv = ["agy", "--print", "{prompt}", "--mode", "accept-edits", "--output-format", "json"]

[runners.agy_argon]
agent = "agy"
provider = "agy"
# une seule session agy headless à la fois tant que la cohabitation n'est pas mesurée
max_parallel = 1
cost_source = "estimate"
# Mesure réelle des tokens depuis la sortie JSON d'agy (aucun coût fourni par le CLI).
usage_format = "agy_json"
# valeurs à calibrer : estimation forfaitaire par run, pas une mesure
window_pct_per_run = 12.0
window_hours = 5.0
estimated_cost_eur = 0.0
estimated_tokens_in = 0
estimated_tokens_out = 0
# Nom exact attendu par `agy --model` (voir la liste affichée par agy en cas de nom inconnu).
argv = ["agy", "--model", "Gemini 4 Argon (High)", "--print", "{prompt}", "--mode", "accept-edits", "--output-format", "json"]

[runners.mistral_vibe]
agent = "mistral"
provider = "mistral"
# Abonnement forfaitaire Mistral (0 € marginal) : workers en parallèle (max 2).
max_parallel = 2
argv = ["vibe", "--prompt", "{prompt}", "--auto-approve", "--trust", "--max-turns", "30"]

# Claude en headless (abonnement Claude : à réserver aux sous-tickets où il apporte quelque chose).
# Jamais choisi par le Gouverneur : `cockpit run T-xxx <projet> --lane claude_haiku`.
[runners.claude_haiku]
agent = "claude"
provider = "claude"
max_parallel = 2
# Mesure réelle des tokens et de l'équivalent API depuis la sortie JSON de claude.
usage_format = "claude_json"
argv = ["claude", "-p", "{prompt}", "--output-format", "json", "--model", "haiku", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Glob,Grep,Bash(python3:*),Bash(make:*)"]

[runners.claude_sonnet]
agent = "claude"
provider = "claude"
max_parallel = 2
# Mesure réelle des tokens et de l'équivalent API depuis la sortie JSON de claude.
usage_format = "claude_json"
argv = ["claude", "-p", "{prompt}", "--output-format", "json", "--model", "sonnet", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Glob,Grep,Bash(python3:*),Bash(make:*)"]

# Ollama local (0 €) : worker local avec qwen3:8b.
# Modèle dérivé à 16k de contexte (l'endpoint /v1 d'Ollama ignore num_ctx).
# Config opencode propre au cockpit via OPENCODE_CONFIG : ~/.config/opencode n'est jamais modifié.
# Pour tickets XS ou tests seuls : `cockpit run T-xxx <projet> --lane local_pc` (le Gouverneur ne la choisit pas seul).
[runners.local_pc]
agent = "local"
provider = "local"
timeout_s = 600
# Mesure réelle des tokens locaux depuis les évènements JSON d'opencode.
usage_format = "opencode_json"
argv = ["opencode", "run", "--format", "json", "--model", "pc3070/qwen3-8b-16k", "{prompt}"]
env = { OPENCODE_CONFIG = "{cockpit}/config/opencode-local.json" }

[runners.local_nas_coder]
agent = "local"
provider = "local"
# Mesure réelle des tokens locaux depuis les évènements JSON d'opencode.
usage_format = "opencode_json"
argv = ["opencode", "run", "--format", "json", "--model", "local-coder", "{prompt}"]

# Porte 1 : audit du diff par le juge Claude Haiku en headless (ou modèle local si backend = "ollama").
[gate1]
backend = "claude"               # "claude" (juge Haiku headless) ou "ollama" (audit local)
judge_model = "haiku"            # modèle Claude utilisé par le juge de revue
judge_timeout_s = 120            # durée maximale d'un appel au juge Claude (secondes)
judge_max_diff_chars = 45000     # taille maximale du diff en caractères avant SKIPPED sans appel
url = "http://127.0.0.1:11434"
model = "Gemma4-ctx:32k"
think = false            # 2 à 4 s sans réflexion, verdicts corrects ; plusieurs minutes avec
max_reworks = 1          # un seul retour au worker sur avis du modèle local, ensuite l'architecte tranche
