# Proxy LiteLLM Unifié Agentic Cockpit V2 (127.0.0.1:4000)
model_list:
  - model_name: nas-gemma4-32k
    litellm_params:
      model: ollama_chat/Gemma4-ctx:32k
      api_base: os.environ/OLLAMA_NAS_API_BASE
      num_ctx: 32768
      keep_alive: -1

  - model_name: local-coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: os.environ/OLLAMA_NAS_API_BASE
      additional_drop_params: ["thinking", "think", "reasoning_effort"]
      num_ctx: 24576
      keep_alive: -1

  - model_name: local-small
    litellm_params:
      model: ollama_chat/qwen2.5-coder:7b
      api_base: os.environ/OLLAMA_API_BASE
      additional_drop_params: ["thinking", "think", "reasoning_effort"]
      num_ctx: 16384
      keep_alive: -1

  - model_name: deepseek-coder
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 60

  - model_name: deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 30

  - model_name: mistral-vibe-coder
    litellm_params:
      model: mistral/devstral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 120

litellm_settings:
  drop_params: true

router_settings:
  num_retries: 2
  timeout: 180
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - mistral-vibe-coder: [deepseek-coder, local-coder]
    - deepseek-coder: [local-coder, local-small]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
