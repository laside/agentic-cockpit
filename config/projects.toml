# Agentic Cockpit V2 — Registre Central Multi-Projets (Option A + ~/agentic-cockpit)
default_project = "mon-app"
cockpit_home = "~/agentic-cockpit"
cockpit_session_prefix = "cockpit"

[hardware.nas_tour]
host = "192.168.0.10"
port = 11434
gpu = "NVIDIA GeForce GTX 1080 Ti (11 Go VRAM)"
audit_model = "Gemma4-ctx:32k"
coder_model = "qwen2.5-coder:14b"
max_ctx_tokens = 32768
measured_prefill_tps = 208
kv_cache_type = "q8_0"
keep_alive = "-1"

[hardware.pc_fractal]
host = "127.0.0.1"
port = 11434
gpu = "NVIDIA GeForce RTX 3070 (8 Go VRAM)"
fixer_model = "qwen2.5-coder:7b"
fast_model = "qwen3:8b"
max_ctx_tokens = 16384
kv_cache_type = "q8_0"

[projects.mon-app]
name = "Mon-app"
root = "~/projets/mon-app"
worktrees_sessions_dir = "~/projets/mon-app-worktrees"
worktrees_tickets_dir = "~/projets/mon-app-worktrees"
default_branch = "main"
milestones = ["M1", "M2", "M3"]
lint_cmd = "make lint"
test_unit_cmd = "make test"

[projects.mon-app.ports]
sidecar = 8790

# Le cockpit lui-même : ses évolutions passent par son propre pipeline (auto-amélioration).
[projects.cockpit]
name = "Agentic Cockpit"
root = "~/agentic-cockpit"
worktrees_sessions_dir = "~/agentic-cockpit-worktrees"
worktrees_tickets_dir = "~/agentic-cockpit-worktrees"
default_branch = "main"
milestones = ["C1", "C2", "C3"]

[projects.cockpit.ports]
sidecar = 8795
